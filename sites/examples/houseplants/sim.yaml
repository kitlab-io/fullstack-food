    enclosure: open
    soil: { initial: 36, evaporation_pct_per_h: 0.4, ml_per_percent: 12 }
  snake-shelf:
    enclosure: open
    soil: { initial: 30, evaporation_pct_per_h: 0.15, ml_per_percent: 15 }

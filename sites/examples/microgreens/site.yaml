kind: Site
id: microgreens
name: "Microgreens: one tray with watering and a grow light"
timezone: UTC
hub: { board: generic-linux }
theme: default
nodes:
  - id: tray-node
    board: esp32-c3-devkitm
    runtime: sim
    devices:
      # Pins were proposed by `just validate --pins`. Calibration values are examples: replace them
      # with measured ones before trusting soil moisture or reservoir level on real hardware.
      - { id: tray-air,        model: aosong.aht20,                 as: sensor.air_temp_humidity, pins: { sda: GPIO5, scl: GPIO6 } }
      - { id: tray-soil,       model: generic.capacitive-soil-v1.2, as: sensor.soil_moisture, pins: { adc: soil-adc/A0 }, calibration: { dry_v: 2.6, wet_v: 1.2 } }
      - { id: tray-lux,        model: ams.tsl2591,                  as: sensor.light, pins: { sda: GPIO5, scl: GPIO6 } }
      - { id: tray-pump,       model: generic.12v-peristaltic-pump, as: actuator.pump, flow_ml_per_s: 2.0, pins: { gate: GPIO7 } }
      - { id: tray-light,      model: generic.cwww-led-strip,       as: actuator.grow_light, pins: { cold: GPIO10, warm: GPIO0 } }
      - { id: reservoir-level, model: generic.hc-sr04,              as: sensor.water_level, pins: { trigger: GPIO1, echo: GPIO3 }, calibration: { empty_cm: 30, full_cm: 5 } }
      - { id: status-strip,    model: worldsemi.ws2812b,            as: indicator.led_strip, led_count: 10, pins: { data: GPIO4 } }
      - { id: soil-adc,        model: ti.ads1115,                   as: sensor.analog_input, pins: { sda: GPIO5, scl: GPIO6 } }
zones:
  - id: tray1
    kind: microgreens_tray
    devices: [tray-air, tray-soil, tray-lux, tray-pump, tray-light, reservoir-level]
    indicator: { strip: status-strip, leds: [0, 9] }
plantings:
  - { id: radish-1, zone: tray1, species: radish-microgreens, recipe: radish-microgreens.standard }

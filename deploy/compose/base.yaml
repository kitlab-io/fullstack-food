# Broker + hub. Use alone with real nodes, or with mock.yaml for a fully simulated site:
#   docker compose -f deploy/compose/base.yaml -f deploy/compose/mock.yaml up --build
name: fullstack-food

services:
  broker:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "127.0.0.1:1883:1883"
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 5s
      timeout: 5s
      retries: 10

  hub:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "fsf_hub", "--site", "sites/examples/${FSF_SITE:-houseplants}",
              "--mqtt-host", "broker", "--db", "/data/hub.db"]
    volumes:
      - hub-data:/data
    depends_on:
      broker:
        condition: service_healthy

  # Dashboard on http://localhost:8080. Set FSF_WEB_PASSWORD_HASH (make one with
  # `python -m fsf_web hash-password`) or nobody can log in. It is published on this machine
  # only; change the port mapping to reach it from the rest of the local network, never the
  # internet.
  web:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "fsf_web", "--site", "sites/examples/${FSF_SITE:-houseplants}",
              "--mqtt-host", "broker", "--db", "/data/hub.db", "--host", "0.0.0.0"]
    environment:
      FSF_WEB_PASSWORD_HASH: ${FSF_WEB_PASSWORD_HASH:-}
      FSF_WEB_READ_WITHOUT_LOGIN: ${FSF_WEB_READ_WITHOUT_LOGIN:-0}
    volumes:
      - hub-data:/data        # the service opens the database read-only
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      broker:
        condition: service_healthy

volumes:
  hub-data:

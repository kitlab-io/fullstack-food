# Broker for a real site: every client logs in, and may touch only the topics the ACL
# gives it. Both files are generated by `fsf init` into sites/local/<site>/broker/.
# Traffic is not encrypted: keep the broker on the local network. TLS is not set up yet.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/
log_type error
log_type warning

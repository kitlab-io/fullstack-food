[project]
name = "fullstack-food"
version = "0.0.0"
description = "Local-network monitoring and climate control for house plants, microgreens and mushrooms"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6", "jsonschema>=4.18", "paho-mqtt>=2"]

[dependency-groups]
dev = ["ruff>=0.11", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["packages/core", "packages/hub", "packages/sim"]

[tool.hatch.build.targets.wheel]
packages = ["packages/core/fsf_core", "packages/hub/fsf_hub", "packages/sim/fsf_sim"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["iot-manager/flask-vue-crud/client"]

[tool.ruff.lint]
# Correctness only for now: syntax errors, undefined names, broken comparisons.
# Style rules get switched on when code moves into packages/ (plan phase 2).
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
# On the board, main.py runs in the namespace boot.py set up (socket, gc, led).
"nodes/mcu/firmware/circuitpython/main.py" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/core", "packages/hub", "packages/sim"]

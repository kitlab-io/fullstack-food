kind: Model
id: ams.tsl2591
name: "ams TSL2591"
implements: [sensor.light]
interface: { bus: i2c, addresses: [0x29], supply_v: [3.3, 5.0] }
drivers:
  - { runtime: esphome, platform: tsl2591, status: untested }
  - { runtime: linux, module: adafruit_tsl2591, status: bench }
  - { runtime: sim, status: verified }
# Pins, wiring, power and bench values below are from general experience with this part.
# Confirm them against the datasheet and on the bench, then set datasheet_checked: true.
datasheet_checked: false
pins:
  - { signal: sda, needs: i2c_sda }
  - { signal: scl, needs: i2c_scl }
wiring:
  - { part: "4.7 kOhm resistor", qty: 2, purpose: "I2C pull-ups to 3.3 V", when: "no breakout on the bus already has pull-ups" }
power: { rail: 3v3, typical_ma: 1, peak_ma: 1 }
bench_test:
  settle_s: 2
  plausible: { illuminance: [0, 2000] }
  stimulus: "Cover the sensor, then shine a torch on it"
  expect: "Reads near zero when covered and rises sharply under the torch"
troubleshooting:
  - symptom: "Not found on the I2C bus"
    causes: ["SDA and SCL swapped", "no pull-ups on the bus", "wrong address", "loose or long wires"]
    checks: ["Scan the bus and compare with the addresses listed above", "Swap SDA and SCL", "Measure 3.3 V at the breakout"]
  - symptom: "Reading pinned at its maximum"
    causes: ["sensor saturated under direct sun or close to the grow light"]
    checks: ["Lower the gain or integration time", "Move the sensor to canopy level, facing up"]
notes: "Bench script: iot-manager/devices/tests/TSL2591.py"

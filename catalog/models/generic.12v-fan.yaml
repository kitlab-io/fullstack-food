kind: Model
id: generic.12v-fan
name: "12 V fan, 50 mm"
implements: [actuator.fan]
interface: { bus: pwm, supply_v: [12, 12], switched_by: mosfet }
drivers:
  - { runtime: esphome, platform: speed fan, status: untested }
  - { runtime: sim, status: verified }
# Pins, wiring, power and bench values below are from general experience with this part.
# Confirm them against the datasheet and on the bench, then set datasheet_checked: true.
datasheet_checked: false
pins:
  - { signal: pwm, needs: pwm }
wiring:
  - { part: "logic-level N-channel MOSFET", qty: 1, purpose: "low-side switch driven from a 3.3 V pin" }
  - { part: "100 Ohm resistor", qty: 1, purpose: "gate series resistor" }
  - { part: "10 kOhm resistor", qty: 1, purpose: "gate pull-down so the load stays off while the board boots" }
  - { part: "1N5819 diode", qty: 1, purpose: "flyback protection across the fan" }
  - { part: "fuse on the 12 V rail", qty: 1, purpose: "protects wiring from a short", when: "the rail has no fuse yet" }
power: { rail: 12v, typical_ma: 100, peak_ma: 200 }
bench_test:
  pulse_s: 2
  stimulus: "Send a 2 s test pulse"
  expect: "The fan spins up, moves air in the intended direction, and stops"
troubleshooting:
  - symptom: "Fan hums but does not start at low levels"
    causes: ["level below what this fan needs to start"]
    checks: ["Raise the minimum level in the recipe", "Start at full level for a second, then drop"]
  - symptom: "Fan blows the wrong way"
    causes: ["mounted back to front"]
    checks: ["Follow the arrow on the fan housing"]
  - symptom: "Node resets or drops off WiFi when it switches on"
    causes: ["supply sags when the motor starts", "no flyback diode", "no common ground between the 12 V supply and the board"]
    checks: ["Power the board from its own supply and try again", "Check the diode is fitted and the right way round", "Check grounds are joined"]
